name: Trigger Docs Site Build

# Content-only repo: the image is built in the site repo, which clones this one during its CI.
# A push here therefore has to start the site's CI on the matching branch.

on:
  workflow_dispatch:
  push:
    # production only. develop is a staging area for drafts — content is not built or published
    # until it is promoted, so a push there deliberately does nothing.
    branches: [production]

jobs:
  trigger:
    name: Start CI in pir2pir-docs-site
    runs-on: [self-hosted, macmini]
    steps:
      - name: Dispatch CI on production
        env:
          REPO_TOKEN: ${{ secrets.REPO_TOKEN }}
          # Hardcoded rather than github.ref_name: production is the only branch that reaches here,
          # and a manual run from another branch must still publish production, never a draft.
          TARGET_REF: production
        run: |
          set -euo pipefail

          # workflow_dispatch, not repository_dispatch: the latter always runs on the site repo's
          # default branch, which would build the wrong engine branch against this content.
          curl --fail-with-body -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${REPO_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/pir2pir/pir2pir-docs-site/actions/workflows/ci.yml/dispatches \
            -d "{\"ref\":\"${TARGET_REF}\"}"

          echo "dispatched pir2pir-docs-site CI on ${TARGET_REF}"
